services:
  dario:
    build:
      context: ..
    image: dario:headless
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3456:3456'
    volumes:
      - dario-data:/home/dario/.dario
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  https:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [dario]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  dario-data:
